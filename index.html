<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shopee Ranking</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #ee4d2d;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      font-size: 14px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 15px;
    }

    .filtros {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .filtros-grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(180px, 1fr)
      );
      gap: 10px;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 14px;
    }

    button {
      cursor: pointer;
      font-weight: bold;
    }

    .btn-atualizar {
      background: #ee4d2d;
      color: white;
      border: none;
    }

    .btn-atualizar:hover {
      opacity: 0.9;
    }

    .info {
      margin-top: 12px;
      font-size: 14px;
      color: #555;
    }

    .produtos {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(240px, 1fr));
      gap: 15px;
    }

    .produto {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow:
        0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
    }

    .produto img {
      width: 100%;
      height: 220px;
      object-fit: contain;
      background: #fafafa;
    }

    .conteudo {
      padding: 14px;
    }

    .produto h3 {
      font-size: 15px;
      margin: 0 0 10px;
      line-height: 1.4;
    }

    .dados {
      font-size: 13px;
      line-height: 1.8;
    }

    .destaque {
      font-weight: bold;
      color: #ee4d2d;
    }

    .comissao {
      color: #159447;
      font-weight: bold;
    }

    /* ===============================
       INDICADORES
    =============================== */

    .indicador {
      display: inline-block;
      margin-bottom: 12px;
      padding: 7px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .indicador-alta {
      background: #d9f7e3;
      color: #08752f;
    }

    .indicador-boa {
      background: #fff3c4;
      color: #8a6500;
    }

    .indicador-volume {
      background: #dcecff;
      color: #1558a6;
    }

    .indicador-outros {
      background: #eeeeee;
      color: #666666;
    }

    .link {
      display: block;
      margin-top: 12px;
      text-align: center;
      background: #ee4d2d;
      color: white;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
    }

    .link:hover {
      opacity: 0.9;
    }

    .copiar-link {
      display: block;
      width: 100%;
      margin-top: 8px;
      background: #159447;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .copiar-link:hover {
      opacity: 0.9;
    }

    .carregando,
    .erro,
    .vazio {
      text-align: center;
      padding: 30px;
      background: white;
      border-radius: 12px;
    }

    .erro {
      color: #c62828;
    }

    @media (max-width: 600px) {

      header h1 {
        font-size: 23px;
      }

      .produto img {
        height: 200px;
      }

    }

  </style>

</head>

<body>

<header>

  <h1>🛍️ Shopee Ranking</h1>

  <p>
    Produtos mais vendidos para afiliados
  </p>

</header>


<div class="container">

  <div class="filtros">

    <div class="filtros-grid">

      <input
        type="text"
        id="pesquisa"
        placeholder="🔎 Pesquisar produto..."
      >

      <input
        type="number"
        id="vendasMinimas"
        placeholder="🔥 Vendas mínimas"
        min="0"
      >

      <input
        type="number"
        id="comissaoMinima"
        placeholder="💰 Comissão mínima (%)"
        min="0"
        step="0.1"
      >

      <input
        type="number"
        id="precoMaximo"
        placeholder="💵 Preço máximo (R$)"
        min="0"
        step="0.01"
      >

      <select id="ordenacao">

        <option value="vendas">
          🔥 Mais vendidos
        </option>

        <option value="comissao">
          💰 Maior comissão (%)
        </option>

        <option value="valorComissao">
          💵 Maior valor de comissão
        </option>

        <option value="precoMenor">
          💲 Menor preço
        </option>

        <option value="avaliacao">
          ⭐ Melhor avaliação
        </option>

      </select>

      <button
        class="btn-atualizar"
        onclick="carregarProdutos()"
      >
        🔄 Atualizar produtos
      </button>

    </div>

    <div
      class="info"
      id="info"
    >
      Carregando produtos...
    </div>

  </div>


  <div
    id="resultado"
    class="carregando"
  >
    Carregando produtos...
  </div>

</div>


<script>

let todosProdutos = [];


/* ==========================================
   CARREGAR PRODUTOS
========================================== */

async function carregarProdutos() {

  const resultado =
    document.getElementById(
      "resultado"
    );

  const info =
    document.getElementById(
      "info"
    );


  resultado.className =
    "carregando";


  resultado.innerHTML =
    "⏳ Carregando produtos...";


  try {

    const resposta =
      await fetch(
        "/api/produtos"
      );


    const dados =
      await resposta.json();


    if (!dados.success) {

      throw new Error(
        dados.error ||
        "Erro ao carregar produtos"
      );

    }


    todosProdutos =
      dados.produtos || [];


    aplicarFiltros();


  } catch (erro) {

    console.error(erro);


    resultado.className =
      "erro";


    resultado.innerHTML =
      "❌ Erro ao carregar produtos.<br><br>" +
      erro.message;


    info.innerText = "";

  }

}


/* ==========================================
   DEFINIR INDICADOR
========================================== */

function definirIndicador(
  vendas,
  comissao
) {

  /*
    Alta combinação:
    500+ vendas + 20%+ comissão
  */

  if (
    vendas >= 500 &&
    comissao >= 20
  ) {

    return {
      classe: "indicador-alta",
      texto: "🟢 Alta combinação"
    };

  }


  /*
    Boa combinação:
    100+ vendas + 10%+ comissão
  */

  if (
    vendas >= 100 &&
    comissao >= 10
  ) {

    return {
      classe: "indicador-boa",
      texto: "🟡 Boa combinação"
    };

  }


  /*
    Volume alto:
    1.000+ vendas
  */

  if (
    vendas >= 1000
  ) {

    return {
      classe: "indicador-volume",
      texto: "🔵 Volume alto"
    };

  }


  return {
    classe: "indicador-outros",
    texto: "⚪ Outros"
  };

}


/* ==========================================
   APLICAR FILTROS
========================================== */

function aplicarFiltros() {

  const pesquisa =
    document
      .getElementById(
        "pesquisa"
      )
      .value
      .toLowerCase()
      .trim();


  const vendasMinimas =
    Number(
      document.getElementById(
        "vendasMinimas"
      ).value
    ) || 0;


  const comissaoMinima =
    Number(
      document.getElementById(
        "comissaoMinima"
      ).value
    ) || 0;


  const precoMaximoCampo =
    document.getElementById(
      "precoMaximo"
    ).value;


  const precoMaximo =
    precoMaximoCampo === ""
      ? Infinity
      : Number(
          precoMaximoCampo
        );


  const ordenacao =
    document.getElementById(
      "ordenacao"
    ).value;


  let produtos =
    todosProdutos.filter(
      produto => {


        const nome =
          String(
            produto.productName || ""
          ).toLowerCase();


        const vendas =
          Number(
            produto.sales || 0
          );


        const comissao =
          Number(
            produto.commissionRate || 0
          ) * 100;


        const preco =
          Number(
            produto.priceMin || 0
          );


        const correspondePesquisa =
          !pesquisa ||
          nome.includes(
            pesquisa
          );


        const correspondeVendas =
          vendas >=
          vendasMinimas;


        const correspondeComissao =
          comissao >=
          comissaoMinima;


        const correspondePreco =
          preco <=
          precoMaximo;


        return (
          correspondePesquisa &&
          correspondeVendas &&
          correspondeComissao &&
          correspondePreco
        );

      }
    );


  /* ========================================
     ORDENAÇÃO
  ======================================== */

  produtos.sort(
    (a, b) => {


      if (
        ordenacao ===
        "vendas"
      ) {

        return (
          Number(
            b.sales || 0
          ) -
          Number(
            a.sales || 0
          )
        );

      }


      if (
        ordenacao ===
        "comissao"
      ) {

        return (
          Number(
            b.commissionRate || 0
          ) -
          Number(
            a.commissionRate || 0
          )
        );

      }


      if (
        ordenacao ===
        "valorComissao"
      ) {

        return (
          Number(
            b.commission || 0
          ) -
          Number(
            a.commission || 0
          )
        );

      }


      if (
        ordenacao ===
        "precoMenor"
      ) {

        return (
          Number(
            a.priceMin || 0
          ) -
          Number(
            b.priceMin || 0
          )
        );

      }


      if (
        ordenacao ===
        "avaliacao"
      ) {

        return (
          Number(
            b.ratingStar || 0
          ) -
          Number(
            a.ratingStar || 0
          )
        );

      }


      return 0;

    }
  );


  mostrarProdutos(
    produtos
  );

}


/* ==========================================
   MOSTRAR PRODUTOS
========================================== */

function mostrarProdutos(
  produtos
) {

  const resultado =
    document.getElementById(
      "resultado"
    );


  const info =
    document.getElementById(
      "info"
    );


  info.innerText =
    `${produtos.length} produto(s) encontrado(s)`;


  if (
    produtos.length === 0
  ) {

    resultado.className =
      "vazio";


    resultado.innerHTML =
      "😕 Nenhum produto encontrado.";


    return;

  }


  resultado.className =
    "produtos";


  resultado.innerHTML =
    produtos
      .map(
        (produto, index) => {


          const vendas =
            Number(
              produto.sales || 0
            );


          const comissao =
            Number(
              produto.commissionRate || 0
            ) * 100;


          const valorComissao =
            Number(
              produto.commission || 0
            );


          const precoMin =
            Number(
              produto.priceMin || 0
            );


          const precoMax =
            Number(
              produto.priceMax || 0
            );


          const avaliacao =
            Number(
              produto.ratingStar || 0
            );


          const desconto =
            Number(
              produto.priceDiscountRate || 0
            );


          const linkAfiliado =
            produto.offerLink ||
            produto.productLink ||
            "";


          const indicador =
            definirIndicador(
              vendas,
              comissao
            );


          let precoTexto =
            `R$ ${precoMin.toFixed(2)}`;


          if (
            precoMax >
            precoMin
          ) {

            precoTexto +=
              ` - R$ ${precoMax.toFixed(2)}`;

          }


          return `

            <div class="produto">

              <img
                src="${produto.imageUrl || ""}"
                alt="${produto.productName || "Produto"}"
                loading="lazy"
              >


              <div class="conteudo">

                <div
                  class="indicador ${indicador.classe}"
                >
                  ${indicador.texto}
                </div>


                <h3>

                  ${index + 1}.
                  ${produto.productName || "Produto sem nome"}

                </h3>


                <div class="dados">

                  🔥 Vendas:

                  <span class="destaque">

                    ${vendas.toLocaleString("pt-BR")}

                  </span>

                  <br>


                  💰 Comissão:

                  <span class="comissao">

                    ${comissao.toFixed(2)}%

                  </span>

                  <br>


                  💵 Valor comissão:

                  <span class="comissao">

                    R$ ${valorComissao.toFixed(2)}

                  </span>

                  <br>


                  💲 Preço:

                  ${precoTexto}

                  <br>


                  ⭐ Avaliação:

                  ${avaliacao.toFixed(1)}

                  <br>


                  🏷️ Desconto:

                  ${desconto.toFixed(0)}%

                  <br>


                  🏪 Loja:

                  ${produto.shopName || "Não informado"}

                </div>


                <a
                  class="link"
                  href="${linkAfiliado || "#"}"
                  target="_blank"
                  rel="noopener noreferrer"
                >

                  🛒 Ver produto / Afiliado

                </a>


                <button
                  class="copiar-link"
                  onclick="copiarLink(
                    this,
                    '${escaparAtributo(linkAfiliado)}'
                  )"
                >

                  🔗 Copiar link de afiliado

                </button>

              </div>

            </div>

          `;

        }
      )
      .join("");

}


/* ==========================================
   ESCAPAR LINK
========================================== */

function escaparAtributo(
  texto
) {

  return String(
    texto || ""
  )
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    )
    .replace(
      /\n/g,
      "\\n"
    )
    .replace(
      /\r/g,
      "\\r"
    );

}


/* ==========================================
   COPIAR LINK
========================================== */

async function copiarLink(
  botao,
  link
) {

  if (!link) {

    alert(
      "❌ Link de afiliado não disponível."
    );

    return;

  }


  try {

    await navigator
      .clipboard
      .writeText(
        link
      );


    const textoOriginal =
      botao.innerText;


    botao.innerText =
      "✅ Link copiado!";


    botao.style.background =
      "#0b7d3b";


    setTimeout(
      () => {

        botao.innerText =
          textoOriginal;


        botao.style.background =
          "#159447";

      },
      2000
    );


  } catch (erro) {

    console.error(
      erro
    );


    try {

      const campo =
        document.createElement(
          "textarea"
        );


      campo.value =
        link;


      campo.style.position =
        "fixed";


      campo.style.left =
        "-9999px";


      document.body.appendChild(
        campo
      );


      campo.select();


      document.execCommand(
        "copy"
      );


      document.body.removeChild(
        campo
      );


      botao.innerText =
        "✅ Link copiado!";


      setTimeout(
        () => {

          botao.innerText =
            "🔗 Copiar link de afiliado";

        },
        2000
      );


    } catch (erro2) {

      alert(
        "❌ Não foi possível copiar o link."
      );

    }

  }

}


/* ==========================================
   EVENTOS
========================================== */

document
  .getElementById(
    "pesquisa"
  )
  .addEventListener(
    "input",
    aplicarFiltros
  );


document
  .getElementById(
    "vendasMinimas"
  )
  .addEventListener(
    "input",
    aplicarFiltros
  );


document
  .getElementById(
    "comissaoMinima"
  )
  .addEventListener(
    "input",
    aplicarFiltros
  );


document
  .getElementById(
    "precoMaximo"
  )
  .addEventListener(
    "input",
    aplicarFiltros
  );


document
  .getElementById(
    "ordenacao"
  )
  .addEventListener(
    "change",
    aplicarFiltros
  );


/* ==========================================
   INICIAR
========================================== */

carregarProdutos();

</script>

</body>
</html>
